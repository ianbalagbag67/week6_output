<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <title>Local Storage - User Preferences</title>
    <style>
        body.dark-mode { background-color: black; color: white; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            Web Systems Laboratory
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="activities.html">Activities</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="index.html#about">About</a>
                </li>

                <li class="nav-item ms-lg-2">
                    <button id="logoutBtn"
                            class="btn btn-outline-light btn-sm mt-1">
                        Logout
                    </button>
                </li>

            </ul>
        </div>
    </div>
</nav>

    <h2>Choose Your Preferences</h2>
    
<label>Theme:</label>
    <select id="theme">
        <option value="light">Light Mode</option>
        <option value="dark">Dark Mode</option>
    </select>
 
   
<label>Language:</label>
    <select id="language">
        <option value="en">English</option>
        <option value="es">Spanish</option>
    </select>
 
    <button onclick="savePreferences()">Save Preferences</button>
    <p id="message"></p>
 
    <script>
        function savePreferences() {
           let theme = document.getElementById("theme").value;
           let language = document.getElementById("language").value;
           localStorage.setItem("theme", theme);
           localStorage.setItem("language", language);
           applyPreferences();
           document.getElementById("message").innerText = "Preferences Saved!";
        }
 
        function applyPreferences() {
            let savedTheme = localStorage.getItem("theme");
            let savedLanguage = localStorage.getItem("language");
            
            if (savedTheme === "dark") {
               document.body.classList.add("dark-mode");
            } else {
               document.body.classList.remove("dark-mode");
            }
 
           document.getElementById("theme").value = savedTheme || "light";
           document.getElementById("language").value = savedLanguage || "en";
        }
 
        applyPreferences();
    </script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script>
        function logout() {
        localStorage.removeItem("githubUsername");
        location.href = "index.html";
}

document.getElementById("logoutBtn").onclick = logout;
</script>

</body>
</html>
